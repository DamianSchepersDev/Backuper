services:
  backuper:
    build: .
    container_name: backuper
    restart: unless-stopped

    user: "1000:1000"

    environment:
      TZ: Europe/Berlin
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

    volumes:
      - ./config.json:/app/config.json:ro
      - ./ssh:/root/.ssh:ro
      - ./backups:/backups

    stop_grace_period: 30s
